<!DOCTYPE html>
<html lang="fr" class="sans-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comportements — CSE</title>

  <!-- Le .ico est le format que le navigateur retrouve le plus surement
       en file://, et il embarque 16, 32, 48 et 64 px dans un seul fichier. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<!-- Trois attributs pilotent toute la page :
       data-theme : "clair" ou "sombre" — le bouton Thème le change
       data-vue   : "accueil" ou "fiche" — décide QUI s'affiche
       data-face  : "geste", "consequences" ou "bon" — donne sa couleur
                    à la scène.
     La scène est VIDE au chargement : app.js la remplit à partir de
     data.js. Le HTML ne décrit plus un écran, il décrit de quoi en
     fabriquer un. -->
<body data-theme="clair" data-vue="accueil" data-face="geste">

<main class="scene">

  <!-- ====================== BARRE DU HAUT ======================
       Commune aux deux vues. Sur l'accueil, la progression et le fil
       d'ariane sont masqués, ainsi que les boutons de fiche.
       ========================================================== -->
  <header class="entete">

    <!-- Un segment par face. La classe "franchi" remplit le segment. -->
    <div class="progression">
      <span class="progression__segment progression__segment--geste"></span>
      <span class="progression__segment progression__segment--consequences"></span>
      <span class="progression__segment progression__segment--bon"></span>
    </div>

    <div class="entete__barre">

      <!-- Le logo porte le nom de l'enseigne : l'attribut alt le dit pour
           qui ne voit pas l'image, et il n'y a pas de texte en double. -->
      <p class="marque"><img src="assets/img/logo-u.webp" alt="Super U"></p>

      <p class="entete__fil"></p>

      <!-- L'en-tête laisse passer les clics pour que toute la scène
           fasse avancer le parcours ; ces boutons les reprennent. -->
      <div class="outils">
        <button type="button" class="bouton bouton--fiche" data-action="accueil">Accueil</button>
        <button type="button" class="bouton bouton--fiche" data-action="rejouer">Recommencer</button>
        <button type="button" class="bouton theme" aria-pressed="false">Thème</button>
      </div>

    </div>

  </header>


  <!-- ========================= L'ACCUEIL =========================
       La grille de cartes est remplie par app.js. Une carte est un
       <button> : le clavier la traverse et l'active sans code en plus.
       ============================================================ -->
  <section class="accueil" id="accueil">

    <div class="accueil__tete">
      <h1 class="accueil__titre">Les bons <b class="cle">comportements</b></h1>
      <p class="accueil__intro">
        Des situations du quotidien : comment une histoire anodine
        dégénère, et ce qu'on peut faire pour l'éviter.
      </p>
    </div>

    <div class="accueil__grille"></div>

  </section>


  <!-- Les faces sont insérées ici, par render(). -->

</main>


<!-- Si app.js ne se charge pas, la scène reste vide : la classe sans-js
     n'est jamais retirée et ce message prend sa place. -->
<p class="secours">Cette application a besoin de JavaScript pour fonctionner.</p>


<!-- ======================== LES MOULES ========================
     Le contenu d'un <template> est parsé mais pas rendu : pas
     d'image chargée, pas de style appliqué. On le clone autant de
     fois qu'on en a besoin.
     =========================================================== -->

<template id="tpl-carte">
  <button type="button" class="carte">
    <span class="carte__vignette"><img class="carte__image" alt=""></span>
    <span class="carte__texte">
      <span class="carte__famille"></span>
      <span class="carte__accroche"></span>
    </span>
  </button>
</template>

<template id="tpl-face">
  <article class="face" hidden>

    <figure class="face__cadre">
      <img class="face__image" src="" alt="">
    </figure>

    <div class="face__propos">
      <span class="face__etiquette"></span>
      <h1 class="face__phrase"></h1>
    </div>

    <!-- La classe "vue" est posée par app.js, une idée par clic. -->
    <div class="idees"></div>

  </article>
</template>

<template id="tpl-idee">
  <article class="idee">
    <span class="idee__rang"></span>
    <p class="idee__texte"></p>
  </article>
</template>


<!-- L'invite : elle apparaît sur la première face ouverte, disparaît au
     premier clic et ne revient pas. Son liseré tourne (voir .invite). -->
<p class="invite" hidden><span class="invite__pouls"></span> Cliquez pour continuer</p>


<!-- Balises classiques, surtout PAS type="module" : les modules ES sont
     bloqués en file://, donc en double-clic. L'ORDRE COMPTE — data.js
     déclare COMPORTEMENTS, app.js le consomme. -->
<script src="data/data.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
